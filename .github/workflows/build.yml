name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git python3-dev libncurses5-dev \
            libffi-dev libssl-dev zip unzip zlib1g-dev \
            autoconf libtool pkg-config liblzma-dev libbz2-dev

      - name: Install Build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3.0.0"

      - name: Pre-accept Android SDK Licenses & Build
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n89330d2226042085a108fc877da80370119fc2fd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a6378b6f4e173269d3a79d31358a1662d" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolenoidDetector-APK
          path: bin/*.apk
          
