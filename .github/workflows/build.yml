name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git python3-dev libncurses5-dev \
            libffi-dev libssl-dev zip unzip zlib1g-dev \
            autoconf libtool pkg-config liblzma-dev libbz2-dev

      - name: Install Build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3.0.0"

      - name: Build APK with Verbose Output
        run: |
          APP_ANDROID_ACCEPT_SDK_LICENSES=1 buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolenoidDetector-APK
          path: bin/*.apk
          
